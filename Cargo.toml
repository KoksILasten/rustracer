[workspace]
resolver = "2"
members = [
    "rustracer-core",
    "rustracer-renderer",
    "rustracer-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
authors = ["Rustracer"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Math
glam = { version = "0.29", features = ["bytemuck", "serde"] }

# GPU
wgpu = "24"
winit = "0.30"
pollster = "0.4"

# Scene
gltf = "1.4"

# Images
image = "0.25"
exr = "1.72"

# Utilities
bytemuck = { version = "1.21", features = ["derive"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

# UI
egui = "0.31"
egui-wgpu = "0.31"
egui-winit = "0.31"

[workspace.lints.rust]
unsafe_code = "warn"
